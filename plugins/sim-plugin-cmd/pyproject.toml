[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sim-plugin-cmd"
version = "0.1.0"
description = "CMD/Shell command execution plugin for sim-cli with security features"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
authors = [{ name = "ww123cqrt-prog" }]
keywords = ["cmd", "shell", "command", "sim-cli", "plugin", "security"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: MacOS",
    "Operating System :: POSIX",
    "Topic :: System :: Systems Administration",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: Apache Software License",
]
dependencies = [
    "sim-cli-core>=0.3",
    "fastapi>=0.100",
    "uvicorn>=0.20",
]

[project.entry-points."sim.drivers"]
cmd = "sim_plugin_cmd:CmdDriver"

[project.entry-points."sim.skills"]
cmd = "sim_plugin_cmd:skills_dir"

[project.entry-points."sim.plugins"]
cmd = "sim_plugin_cmd:plugin_info"
